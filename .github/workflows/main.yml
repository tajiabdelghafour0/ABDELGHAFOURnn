name: Build My PixelFlow APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        
      - name: Install dependencies
        run: bun install
        
      - name: Build Web App
        run: bun run build
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Try to find Android project
        run: |
          echo "كنقلب على مشروع Android..."
          find . -name "gradlew" -type f 2>/dev/null
          ls -la
          echo "إلا ما لقيتش gradlew، خاصك تولد مشروع Android من الموقع أولا"
          
      - name: Build APK if Android project exists
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -n1)
          if [ -n "$GRADLEW" ]; then
            DIR=$(dirname $GRADLEW)
            cd $DIR
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ما كاينش مشروع Android هنا، هادا مشروع Web"
            echo "خاصك تمشي للموقع وتبرك على تحميل مشروع الأندرويد كامل"
            exit 1
          fi
          
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyPixelFlow-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
